name: DualBeat Release APK Builder

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release-apk:
    name: Build & Publish DualBeat APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Install Android SDK Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build Genuine Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Organize Artifact Outputs
        run: |
          mkdir -p release-output
          # Collect Release APK (Unsigned or Signed depending on environment secrets)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-output/DualBeat-v1.2.2-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-output/DualBeat-v1.2.2-release-unsigned.apk
          fi
          # Collect Debug APK with explicit debug naming
          cp app/build/outputs/apk/debug/app-debug.apk release-output/DualBeat-v1.2.2-debug.apk
          ls -la release-output/

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.2
          name: "DualBeat v1.2.2 — Official APK Release"
          files: release-output/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualBeat-v1.2.2-artifacts
          path: release-output/
